# Document types the reader knows.
#
# shape   which fields are read: invoice | payment | other. Fixed by the core.
# bucket  the default sheet. The user can change it in custom.md, but only to a bucket
#         of the same shape (see BUCKETS in buckets.py).

[[type]]
name = "Invoice"
shape = "invoice"
bucket = "Billing documents"

[[type]]
name = "Credit note"
shape = "invoice"
bucket = "Billing documents"

