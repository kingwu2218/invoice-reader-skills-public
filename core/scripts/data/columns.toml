# Output columns: the single source for the workbook, the answer key and the scorer.
#
# key     name used in the extraction JSON and in code
# label   column header in Excel
# kind    text | amount | number | date
# source  extracted: read from the page by the agent (scored cell by cell)
#         meta:      about the document, given by the agent (scored separately)
#         computed:  filled in by the scripts
# locked  true: always exported, even if the company profile hides it

[[documents]]
key = "file"
label = "File"
kind = "text"
source = "meta"
locked = true

[[documents]]
key = "pages"
